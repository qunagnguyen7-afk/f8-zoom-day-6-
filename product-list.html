<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product-list</title>
     <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <div class="main-product">
        <div class="header-product">
            <div class="container-logo">
                 <a href=""><img src="./assets/css/img/laptop.jpg" alt=""></a>
                 <a class="name-logo" href="">LAPTOP333</a>
            </div>


            <div class="search-hearder">
                <input class="search-input" type="search" placeholder="Tìm kiếm sản phẩm ...">
                <button class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></button>


            </div>

            <div class="acount-hearder">
                <a href="">ĐĂNG NHẬP</a>
                <span>|</span>
                <a href="">ĐĂNG KÝ </a>
                <i class="fa-regular fa-registered"></i>

            </div>
            <div class="cart">
                <a href=""><i class="fa-solid fa-cart-shopping"></i>CART</a>
            </div>

        </div>

        <!-- css conten-list product -->
         <div class="content-product">
            <div class="list-item-product">
                <a href="" class="product-link">
                    <div class="box-img-product">
                        <img class="img-product" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShX-EaVw7Zq4M7B3e5lY-4_UqQLq3rTbkkWi22Pd5imQ&s=10" alt="HP Elitebook 6 G1i 16">
                    </div>
                    <h2 class="name-product">HP Elitebook 6 G1i 16</h2>
                    <p class="cost-product">494.999 HUF </p>
                </a>
                <button class="btn-product">ADD FOR CART</button>

            </div>

            <div class="list-item-product">
                <a href="" class="product-link">
                    <img class="img-product" src="https://images.euronics.hu/product_images/800x600/resize/1_707mpb1q.jpg?v=1" alt="Lenovo Yoga Slim 7 83QM007YHV">
                    <h2 class="name-product">Lenovo Yoga Slim</h2>
                    <p class="cost-product">494.999 HUF </p>
                    
                </a>
                <button class="btn-product">ADD FOR CART</button>

            </div>

            <div class="list-item-product">
                <a href="" class="product-link">
                    <img class="img-product" src="https://images.euronics.hu/product_images/800x600/resize/s1_f60r7m8n.jpg?v=1" alt="HP AI 15-fd2001nh 15,6">
                    <h2 class="name-product">HP AI 15-fd2001nh 15,6</h2>
                    <p class="cost-product">339 999 HUF</p>
                </a>
                <button class="btn-product">ADD FOR CART</button>

            </div>

            <div class="list-item-product">
                <a href="" class="product-link">
                     <img class="img-product" src="https://images.euronics.hu/product_images/800x600/resize/1_svr3ad9e.jpg?v=2" alt="Acer Aspire Go 15 AG15-42P">
                    <h2 class="name-product">Acer Aspire Go 15 AG15-42P</h2>
                    <p class="cost-product">229 999 HUF</p>
                </a>
                <button class="btn-product">ADD FOR CART</button>

            </div>

            <div class="list-item-product">
               <a href="" class="product-link">
                 <img class="img-product" src="https://images.euronics.hu/product_images/800x600/resize/1_5swamrjf.jpg?v=2" alt="Asus ZenBook Duo UX8407AA-SN084W">
                 <h2 class="name-product">Asus ZenBook</h2>
                 <p class="cost-product">809 999 HUF</p>
               </a>
                <button class="btn-product">ADD FOR CART</button>

            </div>

            <div class="list-item-product">
                <a href="" class="product-link">
                    <img class="img-product" src="https://images.euronics.hu/product_images/800x600/resize/7_dpv01trh.png?v=2" alt="HP ZBook Ultra G1a 14">
                    <h2 class="name-product">HP ZBook Ultra G1a 14</h2>
                    <p class="cost-product">2 517 999 HUF</p>
                </a>
                <button class="btn-product">ADD FOR CART</button>

            </div>

         </div>



    </div>
    
</body>
</html>
